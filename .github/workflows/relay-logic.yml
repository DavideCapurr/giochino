name: Relay logic guardrail

# Runs the hardware-free verification of the two correctness-critical relay
# algorithms (iOS SentinelChangeTracker + relay turn state machine) on every
# push and PR, so the clock-skew and back-to-back fixes can't silently regress.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify-relay-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify relay pipeline logic
        run: python3 scripts/verify-relay-logic.py
